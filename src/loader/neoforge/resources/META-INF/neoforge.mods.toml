modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPLv3"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Winord"
description = "${mod_description}"
logoFile = "assets/${mod_id}/icon.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range_neoforge}"
ordering = "NONE"
side = "BOTH"
